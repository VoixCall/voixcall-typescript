# Keeps openapi.json and src/gen in step with the live API.
#
# Daily (and by hand): download https://api.voixcall.com/v1/openapi.json,
# regenerate src/gen, and if anything changed open or update a PR from the
# `spec-sync` branch.
#
# Two jobs, so that no npm, generator or test code runs with write access:
# - regen (contents: read) installs, regenerates, typechecks and tests, checks
#   the live default API version, and uploads openapi.json + src/gen.
# - pr (contents: write, pull-requests: write) only checks out, downloads the
#   artifact into place and runs create-pull-request. No node or npm steps.
#
# The PR is opened with the built-in GITHUB_TOKEN. GitHub does not start
# other workflows for events caused by GITHUB_TOKEN, so ci.yml does NOT run
# on that PR by itself. Before merging, run ci.yml on the spec-sync branch
# (Actions -> ci -> Run workflow -> branch spec-sync) or close and reopen
# the PR, and wait for the checks to pass.
#
# Requires Settings -> Actions -> General -> "Allow GitHub Actions to create
# and approve pull requests" (repository, and organization if it is locked
# there). Without it the PR step fails with a 403.
name: spec-sync

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spec-sync
  cancel-in-progress: false

jobs:
  regen:
    name: Fetch the live spec and regenerate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      verify: ${{ steps.verify.outcome }}
      version: ${{ steps.version.outputs.status }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Fetch the live spec and regenerate src/gen
        run: npm run regen

      # Informational: the PR is opened either way, so a breaking API change
      # shows up as a PR reporting the failure instead of a silent job.
      - name: Typecheck and test against the new spec
        id: verify
        continue-on-error: true
        run: npm run typecheck && npm test

      # The API answers a request without VoixCall-Version with its default
      # version; it must equal API_VERSION in src/version.ts. Uses no real
      # credential.
      - name: Live default API version equals API_VERSION
        id: version
        run: |
          sdk="$(sed -n "s/^export const API_VERSION = '\([^']*\)';$/\1/p" src/version.ts)"
          # Tolerant: a network error must not fail the job; it reports "unknown".
          live="$( { curl -sS --max-time 30 -o /dev/null -D - \
            -H 'Authorization: Bearer vc_test_not_a_real_key' \
            https://api.voixcall.com/v1/me || true; } \
            | tr -d '\r' | awk 'tolower($1) == "voixcall-version:" { print $2 }' || true)"
          if [ -z "$live" ]; then
            status="unknown: could not read the live API default version (SDK API_VERSION is '${sdk:-unknown}')"
            echo "::warning::$status"
          elif [ -n "$sdk" ] && [ "$live" = "$sdk" ]; then
            status="match ($live)"
          else
            status="MISMATCH: live API default is '${live:-unknown}', SDK API_VERSION is '${sdk:-unknown}'"
            echo "::warning::$status"
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Upload the regenerated files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: spec-sync
          path: |
            openapi.json
            src/gen/
          if-no-files-found: error
          retention-days: 3

  pr:
    name: Open or update the spec-sync PR
    needs: regen
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # Download OUTSIDE the workspace, then copy exactly openapi.json and
      # src/gen into place, refusing symlinks and any other path. v8.0.1
      # extracts with unzip-stream 0.3.4 (no path traversal); the checks
      # below make sure nothing else (for example .git/hooks) can be written
      # while this job holds the write token. Upload stays on v4; v8
      # downloads v4 uploads.
      - name: Download the regenerated files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: spec-sync
          path: ${{ runner.temp }}/spec-sync

      - name: Put exactly openapi.json and src/gen in place
        run: |
          d="$RUNNER_TEMP/spec-sync"
          if [ -n "$(find "$d" -type l -print -quit)" ]; then echo "::error::artifact contains a symlink"; exit 1; fi
          if [ -n "$(find "$d" -name .git -print -quit)" ]; then echo "::error::artifact contains .git"; exit 1; fi
          extra="$(cd "$d" && find . -mindepth 1 -maxdepth 1 ! -name openapi.json ! -name src; cd "$d/src" && find . -mindepth 1 -maxdepth 1 ! -name gen)"
          if [ -n "$extra" ]; then echo "::error::unexpected paths in artifact: $extra"; exit 1; fi
          rm -rf openapi.json src/gen
          cp "$d/openapi.json" openapi.json
          cp -R "$d/src/gen" src/gen

      - name: Open or update the spec-sync PR
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7.0.11
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: spec-sync
          delete-branch: true
          add-paths: |
            openapi.json
            src/gen/**
          commit-message: 'chore(spec): sync openapi.json from api.voixcall.com and regenerate src/gen'
          title: 'chore(spec): sync the OpenAPI spec from the live API'
          body: |
            Automated by `.github/workflows/spec-sync.yml`: `npm run regen` against https://api.voixcall.com/v1/openapi.json found changes.

            - Typecheck and tests against the new spec: **${{ needs.regen.outputs.verify }}**
            - Live default API version vs the SDK's `API_VERSION`: **${{ needs.regen.outputs.version }}**

            **CI has not run on this PR.** It was opened with `GITHUB_TOKEN`, which does not trigger other workflows. Before merging, run the `ci` workflow on the `spec-sync` branch (Actions -> ci -> Run workflow) or close and reopen this PR, and wait for the checks.

            If the change is user-visible (a new field, a new endpoint, a changed type), also update the hand-written wrapper, README and `version` as needed. On a version mismatch, update `API_VERSION` in `src/version.ts`.
